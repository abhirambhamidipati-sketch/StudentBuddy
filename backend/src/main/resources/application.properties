# ── Datasource ─────────────────────────────────────────────────────────────────
# File-based H2 so data survives application restarts.
# The ./data/ directory is created automatically by H2 on first run.
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────────
# update: creates tables on first run, updates schema on subsequent runs.
# Never use 'create' or 'create-drop' in persistent environments.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── H2 Console ──────────────────────────────────────────────────────────────────
# Disabled — persistence is validated through the REST API, not the browser console.
# Enabling it without Spring Security causes 404 in Spring Boot 3+/4+.
spring.h2.console.enabled=false
