# ── Datasource ─────────────────────────────────────────────────────────────────
# File-based H2 so data survives application restarts.
spring.datasource.url=jdbc:h2:file:./data/studentbuddy
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────────
# update: creates missing tables/columns on startup, never drops data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── H2 Console ──────────────────────────────────────────────────────────────────
# Disabled — persistence validated via REST API only.
spring.h2.console.enabled=false

# ── JWT ─────────────────────────────────────────────────────────────────────────
# Secret used for HMAC signing. Must be at least 32 characters.
# Replace with a strong random value before deploying to production.
app.jwt.secret=studentbuddy-jwt-secret-key-change-in-production-min32c

