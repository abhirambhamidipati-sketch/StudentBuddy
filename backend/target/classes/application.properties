# ── DATASOURCE ─────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/studentbuddy
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── H2 CONSOLE (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────
# In production: set JWT_SECRET env var to a 32+ char random string.
app.jwt.secret=${JWT_SECRET:studentbuddy-dev-only-secret-key-min32b}

# ── OPENAI ─────────────────────────────────
# For local dev: key is embedded as fallback so no env var needed.
# In production: set OPENAI_API_KEY env var and remove the hardcoded value.
openai.api.key=${OPENAI_API_KEY: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}

# ── GOOGLE OAUTH ───────────────────────────
# In production: set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET env vars.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google